<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misión Ares-I: Diseña, Lanza y Sobrevive</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- BARRA SUPERIOR FIJA DE 6 RECURSOS -->
  <header class="barra-recursos-fija" id="barra-recursos">
    <div class="recursos-grid">
      <div class="recurso-card" id="card-res-presupuesto" title="Presupuesto disponible vs gastado">
        <div class="recurso-header">
          <span class="recurso-label">💰 Presupuesto</span>
          <span class="recurso-valor" id="res-presupuesto-val">-- / -- M$</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="res-presupuesto-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="recurso-card" id="card-res-masa" title="Masa de la nave vs capacidad del lanzador">
        <div class="recurso-header">
          <span class="recurso-label">⚖️ Masa</span>
          <span class="recurso-valor" id="res-masa-val">-- / -- kg</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="res-masa-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="recurso-card" id="card-res-energia" title="Factor de suficiencia energética en Marte">
        <div class="recurso-header">
          <span class="recurso-label">⚡ Energía</span>
          <span class="recurso-valor" id="res-energia-val">--%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="res-energia-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="recurso-card" id="card-res-datos" title="Datos generados / capacidad de transmisión">
        <div class="recurso-header">
          <span class="recurso-label">📡 Datos / TX</span>
          <span class="recurso-valor" id="res-datos-val">-- / -- UD</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="res-datos-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="recurso-card" id="card-res-comms" title="Cobertura de retransmisión orbital">
        <div class="recurso-header">
          <span class="recurso-label">🛰️ Enlace Relay</span>
          <span class="recurso-valor" id="res-comms-val">--%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="res-comms-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="recurso-card" id="card-res-tiempo" title="Meses de desarrollo vs ventana de lanzamiento (28m)">
        <div class="recurso-header">
          <span class="recurso-label">⏳ Tiempo</span>
          <span class="recurso-valor" id="res-tiempo-val">-- / 28 m</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="res-tiempo-bar" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE ESCENAS -->
  <main class="app-main" id="app-main">
    <section class="escena activa" id="escena-briefing"></section>
    <section class="escena" id="escena-design"></section>
    <section class="escena" id="escena-flight"></section>
    <section class="escena" id="escena-rover"></section>
    <section class="escena" id="escena-report"></section>
  </main>

  <!-- SCRIPTS: Carga única en orden de dependencias -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sprites.js"></script>

  <!-- Escenas -->
  <script src="js/scenes/briefing.js"></script>
  <script src="js/scenes/design.js"></script>
  <script src="js/scenes/flight.js"></script>
  <script src="js/scenes/rover.js"></script>
  <script src="js/scenes/report.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.UI?.cambiarEscena) {
        window.UI.cambiarEscena('briefing');
      }
    });
  </script>
</body>

</html>
